<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budgetree Cash Token</title>
<meta name="theme-color" content="#064E3B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one mobile column (max 430px) centred on larger screens; sticky action button at the bottom of each step */
:root{
  --forest:#064E3B; --g700:#0A6B50; --deep:#043A2C; --em:#10B981; --mint:#BBF7D0; --g100:#D1FAE5;
  --bg:#E8F0EC; --card:#FFFFFF; --muted:#4B6B60; --line:#CFE3D8; --ok:#16A34A; --on:#F0FDF4;
  --err:#C2410C; --errbg:#FFF1EB;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --rupee:"Plus Jakarta Sans","Noto Sans","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--forest);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
.app{position:relative;max-width:430px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(circle at 10% 6%,var(--g100) 0,transparent 45%),radial-gradient(circle at 95% 45%,rgba(16,185,129,.16) 0,transparent 40%),radial-gradient(circle at 15% 85%,#fff 0,transparent 45%),var(--bg)}
@media (min-width:600px){body{padding-block:24px}.app{min-height:calc(100% - 0px);border-radius:32px;box-shadow:0 30px 80px -30px rgba(6,78,59,.35)}}
.app.dark{background:radial-gradient(circle at 50% 30%,#0E7A5A 0,transparent 55%),linear-gradient(180deg,#0A6B50,#032C22);color:#fff}
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding-block:20px 14px}
.brand svg{height:24px;width:auto;display:block;fill:var(--forest)}
.brand small{display:block;margin-top:6px;font-size:11px;font-weight:600;color:var(--muted)}
.dark .brand svg{fill:#fff}.dark .brand small{color:rgba(255,255,255,.75)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:#fff;border:1.2px solid var(--mint);font-size:12px;font-weight:700;color:var(--forest)}
.dark .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.tick{width:16px;height:16px;flex:none}

main{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:18px}
.screen{display:flex;flex-direction:column;gap:14px;flex:1;animation:in .35s ease both}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* banner + logo slot */
.banner{position:relative;height:150px;border-radius:24px;background:linear-gradient(135deg,var(--g100),#A7F3D0);margin-bottom:34px;overflow:visible}
.banner .bimg{position:absolute;inset:0;border-radius:24px;background-size:cover;background-position:center}
.banner .bph{position:absolute;inset:0;border:1.5px dashed var(--em);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;color:var(--forest)}
.banner .bph span{font-size:11px;font-weight:500;color:var(--muted)}
.avatar{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:#fff;border:4px solid var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(6,78,59,.35)}
.avatar svg{width:56px;fill:var(--forest)}
h1{margin:0;font-size:22px;font-weight:800;text-align:center;text-wrap:balance;letter-spacing:-.01em}
h2{margin:0;font-size:19px;font-weight:800;text-wrap:balance}

/* ticket */
.ticket{position:relative;border-radius:24px;padding:16px 18px 12px;background:linear-gradient(135deg,var(--g700),var(--deep));color:var(--on);overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;top:62px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.ticket::before{left:-8px}.ticket::after{right:-8px}
.ticket .lbl{font-size:12px;font-weight:600;opacity:.85}
.ticket .amt{font-size:30px;font-weight:800;letter-spacing:-.01em;font-family:var(--rupee);margin-top:2px}
.ticket .coin{position:absolute;right:18px;top:16px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#34D399,var(--em) 60%,#047857);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;box-shadow:0 0 0 6px rgba(16,185,129,.25)}
.ticket .glow{position:absolute;right:-20px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--em);opacity:.35;filter:blur(8px)}
.ticket .foot{display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1.5px dashed rgba(255,255,255,.28);font-size:11px;font-weight:600}
.ticket .foot b{color:#6EE7B7}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.flabel{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;color:var(--forest)}
.flabel .opt{font-size:10.5px;letter-spacing:.06em;color:var(--em)}
.flabel button{border:0;background:none;padding:0;color:var(--em);font-weight:700;font-size:12.5px;cursor:pointer}
.input{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;background:#fff;border:1.4px solid var(--mint);border-radius:18px;transition:border-color .15s,box-shadow .15s}
.input:focus-within{border-color:var(--forest);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.input input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;font-weight:600;color:var(--forest)}
.input input::placeholder{color:#9DB5AA;font-weight:500}
.input input:disabled{color:var(--muted)}
.input.bad{border-color:var(--err)}
.input.lock{background:#F4FAF7}
.err{font-size:12px;font-weight:600;color:var(--err);min-height:0}
.err:empty{display:none}
.hint{font-size:12px;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px}
.cc{flex:none;width:92px;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.flag{width:20px;height:14px;border-radius:2px;overflow:hidden;display:flex;flex-direction:column;flex:none}
.flag i{flex:1}.flag i:nth-child(1){background:#FF9933}.flag i:nth-child(2){background:#fff;position:relative}.flag i:nth-child(3){background:#138808}
.flag i:nth-child(2)::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:#000080;transform:translate(-50%,-50%)}

/* otp */
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{width:100%;height:56px;text-align:center;font-size:22px;font-weight:800;color:var(--forest);background:var(--g100);border:1.4px solid transparent;border-radius:16px;outline:0;font-variant-numeric:tabular-nums}
.otp input:focus{background:#fff;border-color:var(--forest)}
.otp.bad input{border-color:var(--err);background:var(--errbg)}
.otp.good input{border-color:var(--ok);background:#fff}
.otpmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reading{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--forest)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--mint);border-top-color:var(--em);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.resend{border:0;height:28px;padding:0 12px;border-radius:14px;background:var(--g100);color:var(--forest);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.resend:disabled{cursor:default;opacity:.8}
.demo{font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.6);border:1px dashed var(--mint);border-radius:12px;padding:8px 10px}
.demo b{color:var(--forest)}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#DCE8E2;border-radius:20px}
.seg button{height:42px;border:0;border-radius:16px;background:none;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:#fff;color:var(--forest);box-shadow:0 2px 8px -2px rgba(6,78,59,.2)}
.verified{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--g100);border:1px solid var(--mint)}
.verified small{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.verified b{font-size:14px;letter-spacing:.02em}
.verified.wait{background:#fff}
.chip-ok{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;background:var(--g100);font-size:10.5px;font-weight:700;color:var(--g700);white-space:nowrap}
.note{font-size:12px;font-weight:600;padding:10px 14px;border-radius:14px;background:var(--g100);color:var(--g700)}

/* buttons */
.cta{margin-top:auto;padding-top:8px}
.btn{width:100%;height:56px;border:0;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,var(--g700),var(--forest));color:var(--on);box-shadow:0 12px 24px -12px rgba(6,78,59,.6);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--forest);border:1.4px solid var(--mint);box-shadow:none}
.btn:focus-visible,.seg button:focus-visible,.resend:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.btn svg{width:18px;height:18px}
.subcta{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--g700)}

/* processing */
.orbit{position:relative;width:220px;height:220px;margin:10px auto 0}
.orbit .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,255,255,.25)}
.orbit .ring.r2{inset:26px;border-style:solid;border-color:rgba(110,231,183,.25)}
.orbit svg.prog{position:absolute;inset:40px;transform:rotate(-90deg)}
.orbit .core{position:absolute;inset:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#34D399,var(--em) 55%,#047857);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;font-family:var(--rupee);box-shadow:0 0 40px rgba(16,185,129,.6);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 60px rgba(16,185,129,.9)}}
.orbit .dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#6EE7B7;animation:orb 3s linear infinite}
@keyframes orb{from{transform:rotate(0) translateX(104px)}to{transform:rotate(360deg) translateX(104px)}}
.from,.to{margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:22px}
.from{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:10px;font-weight:700;letter-spacing:.08em}
.from svg{height:16px;fill:#fff}
.to{background:#fff;color:var(--forest);min-width:200px}
.to small{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--em)}
.to b{font-size:13px}
.ptitle{text-align:center}
.ptitle h2{font-size:22px;color:#fff}
.ptitle p{margin:6px 0 0;font-size:13px;color:rgba(255,255,255,.8)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6EE7B7,#fff);border-radius:4px;transition:width .2s linear}
.barmeta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.steps span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:11.5px;font-weight:700;opacity:.5;transition:opacity .3s,background .3s}
.steps span.on{opacity:1}
.steps span.now{background:#fff;color:var(--forest);opacity:1}
.warn{display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}

/* success / failure */
.hero{margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:8px 20px 34px;background:linear-gradient(180deg,var(--g700),var(--deep));color:#fff;border-radius:0 0 50% 50% / 0 0 40px 40px;text-align:center;position:relative;overflow:hidden}
.hero.fail{background:linear-gradient(180deg,#7C2D12,#431407)}
.hero .big{width:96px;height:96px;margin:6px auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#34D399,var(--em) 60%,#047857);box-shadow:0 0 0 12px rgba(16,185,129,.18),0 0 0 24px rgba(16,185,129,.08);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.hero.fail .big{background:radial-gradient(circle at 35% 30%,#FB923C,#EA580C 60%,#9A3412);box-shadow:0 0 0 12px rgba(234,88,12,.2),0 0 0 24px rgba(234,88,12,.08)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.hero .big svg{width:46px;height:46px}
.hero h2{font-size:24px;color:#fff}
.hero p{margin:6px 0 0;font-size:13px;opacity:.85;font-weight:600}
.conf{position:absolute;width:5px;height:12px;border-radius:2px;background:#6EE7B7;opacity:.8}
.receipt{position:relative;background:#fff;border:1.2px solid var(--mint);border-radius:24px;padding:16px 18px;margin-top:-6px}
.receipt::before,.receipt::after{content:"";position:absolute;top:78px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.2px solid var(--mint)}
.receipt::before{left:-10px;clip-path:inset(0 0 0 50%)}.receipt::after{right:-10px;clip-path:inset(0 50% 0 0)}
.receipt .top{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:1.5px dashed var(--line)}
.receipt .top small{font-size:11px;font-weight:600;color:var(--muted)}
.receipt .top .amt{font-size:28px;font-weight:800;font-family:var(--rupee)}
.status{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--g100);font-size:11px;font-weight:700;color:var(--g700)}
.status.f{background:var(--errbg);color:var(--err)}
dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;font-size:12.5px}
dt{color:var(--muted);font-weight:500}
dd{margin:0;text-align:right;font-weight:700;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.copy{border:0;background:none;color:var(--em);font-weight:700;font-size:11px;cursor:pointer;padding:0 0 0 6px}

footer{padding-block:6px 18px;text-align:center;font-size:12px;line-height:1.7}
footer .h{font-weight:600;color:var(--g700)}
footer .p{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-weight:500}
footer .p svg{height:12px;fill:var(--forest)}
.dark footer .h{color:#A7F3D0}.dark footer .p{color:rgba(255,255,255,.75)}.dark footer .p svg{fill:#fff}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(380px,calc(100% - 32px));padding:12px 16px;border-radius:14px;background:var(--forest);color:#fff;font-size:13px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* tester panel */
.tbtn{position:fixed;left:env(safe-area-inset-left,0px);top:50%;z-index:40;width:22px;height:64px;border-radius:0 10px 10px 0;writing-mode:vertical-rl;letter-spacing:.1em;opacity:.55;border:0;background:#111827;color:#fff;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
.tpanel{position:fixed;left:calc(28px + env(safe-area-inset-left,0px));top:30%;z-index:40;width:250px;max-width:calc(100% - 24px);background:#111827;color:#E5E7EB;border-radius:16px;padding:14px;font-size:12px;box-shadow:0 20px 40px -10px rgba(0,0,0,.5)}
.tpanel h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9CA3AF}
.tpanel .g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.tpanel button{height:30px;border:1px solid #374151;background:#1F2937;color:#fff;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer}
.tpanel label{display:flex;align-items:center;gap:8px;margin-top:6px}
.tpanel p{margin:8px 0 0;color:#9CA3AF;line-height:1.5}


/* location gate */
.gate{align-items:center;text-align:center;justify-content:center;gap:16px}
.pin{position:relative;width:150px;height:150px;margin:18px auto 6px;display:flex;align-items:center;justify-content:center}
.pin::before,.pin::after,.pin i{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--em);opacity:0;animation:ring 2.4s ease-out infinite}
.pin::after{animation-delay:.8s}.pin i{animation-delay:1.6s}
.pin .core{position:relative;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#34D399,var(--em) 55%,#047857);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -12px rgba(6,78,59,.55);animation:bob2 2.6s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-6px)}}
.pin .core svg{width:42px;height:42px}
.pin.denied .core{background:radial-gradient(circle at 35% 30%,#FB923C,#EA580C 60%,#9A3412)}
.pin.denied::before,.pin.denied::after,.pin.denied i{border-color:#EA580C}
.pin.ok .core{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.gate p.lead{margin:0;max-width:30ch;font-size:14px;line-height:1.55;color:var(--muted);font-weight:500}
.why{width:100%;display:grid;gap:8px;text-align:left}
.why div{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#fff;border:1.2px solid var(--mint);border-radius:16px;font-size:12.5px;font-weight:600}
.why div span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:14px}
.howto{width:100%;text-align:left;background:var(--errbg);border:1.2px solid #FED7AA;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.6;color:#7C2D12}
.howto .ht{display:block;margin-bottom:4px;font-weight:800;color:var(--err)}
.howto ol{margin:0;padding-left:18px}
.linkbtn{border:0;background:none;color:var(--g700);font-weight:700;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px}
.cta.full{width:100%}

.loc{border-radius:20px;background:#fff;border:1.4px solid var(--mint);padding:12px;display:flex;flex-direction:column;gap:10px;transition:background .3s,border-color .3s}
.loc.ok{background:var(--g100);border-color:var(--em)}
.loc.denied,.loc.unsupported{background:var(--errbg);border-color:#FDBA8C}
.loc.shake{animation:shake .4s}
.loc-row{display:flex;align-items:center;gap:12px}
.loc-ic{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#34D399,var(--em) 55%,#047857);box-shadow:0 8px 18px -8px rgba(6,78,59,.6)}
.loc-ic svg{width:22px;height:22px;position:relative}
.loc-ic i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--em);animation:ring 2s ease-out infinite}
.loc.ok .loc-ic{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}.loc.ok .loc-ic i{display:none}
.loc.denied .loc-ic,.loc.unsupported .loc-ic{background:radial-gradient(circle at 35% 30%,#FB923C,#EA580C 60%,#9A3412)}
.loc.denied .loc-ic i,.loc.unsupported .loc-ic i{border-color:#EA580C}
.loc-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.loc-tx b{font-size:14px;font-weight:800}
.loc-tx span{font-size:12px;color:var(--muted);font-weight:500;line-height:1.4}
.loc.denied .loc-tx b{color:var(--err)}
.loc-btn{flex:none;height:38px;padding:0 16px;border:0;border-radius:19px;background:linear-gradient(180deg,var(--g700),var(--forest));color:var(--on);font-weight:700;font-size:13px;cursor:pointer;position:relative;overflow:hidden}
.loc-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%) 0 0/250% 100%;animation:shim 2.4s ease-in-out infinite}
.loc-btn:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.loc .linkbtn{align-self:flex-start;padding:0}

.app::after{width:240px;height:240px;right:-90px;top:40%;background:rgba(16,185,129,.22);animation:drift 18s ease-in-out infinite alternate-reverse}

@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}}

async function post(path,body){
  const r=await fetch(CONFIG.API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||'Something went wrong. Please try again.');
  return j;
}

function askLocation(){

  const end=()=>{askLocation._busy=false};
  const tryGet=(high)=>navigator.geolocation.getCurrentPosition(
    p=>{end();locOk(p)},
    e=>{ if(e&&e.code===1){end();locState='denied';renderLoc();return}          // user or browser blocked it
         if(high){tryGet(false);return}                                          // GPS slow or off: retry with network location
         end();locState='nogps';renderLoc() },
    {enableHighAccuracy:high,timeout:high?10000:20000,maximumAge:120000});
  try{tryGet(true)}catch(e){end();locState='denied';renderLoc()}
}

// IFSC lookup: real bank + branch from Razorpay's free IFSC API on your own site; bank-code list as a fallback.
const ifscCache={};
async function lookupIfsc(code){
  if(code in ifscCache)return ifscCache[code];
  let info=null;
  if(!inFrame){try{const r=await fetch('https://ifsc.razorpay.com/'+code);if(r.ok){const j=await r.json();info={bank:j.BANK,branch:j.BRANCH,city:j.CITY}}else if(r.status===404){ifscCache[code]=null;return null}}catch(e){}}
  if(!info){await wait(300);const b=IFSC[code.slice(0,4)];info=b?{bank:b}:null}
  ifscCache[code]=info;return info;
}
function upiError(v){
  if(!v.includes('@'))return 'A UPI ID has an @, like name@okaxis or 9876543210@ybl.';
  const [u,h,...rest]=v.split('@');
  if(rest.length)return 'A UPI ID can have only one @.';
  if(!u)return 'Add your name or number before the @.';
  if(/^\d+$/.test(u)&&!/^[6-9]\d{9}$/.test(u))return 'A number-based UPI ID uses your 10-digit mobile number, like 9876543210@ybl.';
  if(!/^[a-z0-9][a-z0-9._-]{1,48}[a-z0-9]$/.test(u))return 'The part before @ can use letters, numbers, dot, dash or underscore (3 to 50 characters).';
  if(!h)return 'Add your UPI app handle after the @, like okaxis, ybl or paytm.';
  if(!UPI_HANDLES.includes(h))return `"@${h}" isn't a UPI handle we recognise. Check it in your UPI app (for example @okaxis, @ybl, @paytm).`;
  return '';
}

    area.innerHTML=`<div class="field"><label class="flabel" for="acct">Account number</label><div class="input" id="acctBox"><input id="acct" inputmode="numeric" autocomplete="off" placeholder="9 to 18 digits" value="${esc(S.acct.replace(/(\d{4})(?=\d)/g,'$1 '))}" maxlength="22"></div><div class="err" id="acctErr"></div></div>
      <div class="field"><label class="flabel" for="acct2">Re-enter account number</label><div class="input" id="acct2Box"><input id="acct2" inputmode="numeric" autocomplete="off" placeholder="Type it again to confirm" value="${esc(S.acct2.replace(/(\d{4})(?=\d)/g,'$1 '))}" maxlength="22"><span id="matchChip"></span></div><div class="err" id="acct2Err"></div></div>
      <div class="field"><label class="flabel" for="ifsc">IFSC code</label><div class="input" id="ifscBox"><input id="ifsc" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="e.g. SBIN0001234" value="${esc(S.ifsc)}" maxlength="11"><span id="bankChip"></span></div><div class="err" id="ifscErr"></div></div>
      <div id="nameCard"></div>`;
    const acct=$('#acct'),acct2=$('#acct2'),ifsc=$('#ifsc');
    const acctOk=()=>/^\d{9,18}$/.test(S.acct)&&!/^(\d)\1+$/.test(S.acct)&&!/^0+$/.test(S.acct),ifscFmt=()=>/^[A-Z]{4}0[A-Z0-9]{6}$/.test(S.ifsc);
    const matchOk=()=>S.acct2.length>0&&S.acct2===S.acct;
    let ifscInfo=null,ifscFor='';
    const check=()=>{ready=false;sync();clearTimeout(lookT);const nc=$('#nameCard');
      $('#matchChip').innerHTML=S.acct2.length>=9?(matchOk()?`<span class="chip-ok">${TICK()}Matches</span>`:''):'';
      if(S.acct2.length>=S.acct.length&&S.acct2&&!matchOk()){$('#acct2Box').classList.add('bad');$('#acct2Err').textContent='The account numbers don\'t match. Check both and try again.'}
      if(!ifscFmt()){S.bank='';$('#bankChip').innerHTML='';nc.innerHTML='';return}
      if(ifscFor!==S.ifsc){ifscFor=S.ifsc;ifscInfo=null;S.bank='';$('#bankChip').innerHTML='<span class="spin"></span>';
        const q=S.ifsc;lookupIfsc(q).then(info=>{if(S.ifsc!==q)return;ifscInfo=info;
          if(!info){$('#bankChip').innerHTML='';$('#ifscBox').classList.add('bad');$('#ifscErr').textContent='We couldn\'t find this IFSC. Check it on your cheque book or bank app.';return}
          S.bank=info.bank;$('#bankChip').innerHTML=`<span class="chip-ok">${TICK()}${esc(SHORT[q.slice(0,4)]||info.bank)}</span>`;$('#ifscErr').innerHTML=info.branch?`<span style="color:var(--muted)">${esc(info.branch)}${info.city?', '+esc(info.city):''}</span>`:'';check()});
        nc.innerHTML='';return}
      if(!ifscInfo){nc.innerHTML='';return}
      if(!(acctOk()&&matchOk())){nc.innerHTML='';return}
      nc.innerHTML=`<div class="verified wait"><span class="spin"></span><div><small>Checking with ${esc(S.bank)}</small><b>Fetching account holder name…</b></div></div>`;
      const qa=S.acct,qi=S.ifsc;lookT=setTimeout(()=>API.lookupBank(qa,qi).then(res=>{if(S.acct!==qa||S.ifsc!==qi)return;if(!res.valid){nc.innerHTML='';$('#acctErr').textContent='We could not find this account. Check the account number and IFSC.';return}if(res.bank)S.bank=res.bank;S.bankName=res.name;nc.innerHTML=`<div class="verified">${TICK()}<div><small>Name as per bank records</small><b>${esc(S.bankName)}</b></div></div>`;ready=true;sync()}).catch(e=>{nc.innerHTML='';$('#acctErr').textContent=e.message}),500);timers.push(lookT)};
    acct.addEventListener('input',()=>{const d=acct.value.replace(/\D/g,'').slice(0,18);S.acct=d;acct.value=d.replace(/(\d{4})(?=\d)/g,'$1 ');$('#acctBox').classList.remove('bad');$('#acctErr').textContent='';$('#acct2Box').classList.remove('bad');$('#acct2Err').textContent='';check()});
    acct.addEventListener('blur',()=>{if(S.acct&&!acctOk()){$('#acctBox').classList.add('bad');$('#acctErr').textContent='Enter a valid account number (9 to 18 digits).'}});
    acct2.addEventListener('input',()=>{const d=acct2.value.replace(/\D/g,'').slice(0,18);S.acct2=d;acct2.value=d.replace(/(\d{4})(?=\d)/g,'$1 ');$('#acct2Box').classList.remove('bad');$('#acct2Err').textContent='';check()});
    acct2.addEventListener('paste',e=>{e.preventDefault();toast('Please type the account number again to confirm')});
    acct2.addEventListener('blur',()=>{if(S.acct2&&!matchOk()){$('#acct2Box').classList.add('bad');$('#acct2Err').textContent='The account numbers don\'t match. Check both and try again.'}});
    ifsc.addEventListener('input',()=>{S.ifsc=ifsc.value.toUpperCase().replace(/[^A-Z0-9]/g,'');ifsc.value=S.ifsc;$('#ifscBox').classList.remove('bad');$('#ifscErr').textContent='';check()});
    ifsc.addEventListener('blur',()=>{if(S.ifsc&&!ifscFmt()){$('#ifscBox').classList.add('bad');$('#ifscErr').textContent='IFSC has 11 characters: 4 letters, a zero, then 6 letters or digits. It is printed on your cheque book.'}});
    check();
  }
  sync();
  cta.onclick=()=>{if(cta.disabled)return;S.time=new Date();go('processing')};
}

/* ---------- 3 · Processing ---------- */
function viewProcessing(){
  const upi=S.method==='upi';const dur=tOpt('tFast',true)?6:20;
  main.innerHTML=`<section class="screen" style="gap:18px">
    <div class="from">FROM ${LOGOSVG}</div><div class="trail"></div>
    <div class="orbit"><div class="ring"></div><div class="ring r2"></div>
      <svg class="prog" viewBox="0 0 140 140"><circle cx="70" cy="70" r="64" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/><circle id="arc" cx="70" cy="70" r="64" fill="none" stroke="#6EE7B7" stroke-width="6" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402"/></svg>
      <div class="core">₹${TOKEN.amount}</div>${flyers()}<span class="dot"></span><span class="dot" style="animation-delay:-1s"></span><span class="dot" style="animation-delay:-2s"></span></div>
    <div class="trail"></div><div class="to">${upi?'<span style="font-size:18px">⚡</span>':'<span style="font-size:18px">🏛</span>'}<div><small>TO · ${upi?'UPI':'BANK'}</small><b>${esc(upi?S.upi:(bshort()+' ••'+S.acct.slice(-4)))}</b></div></div>
    <div class="ptitle"><h2>Your ₹${TOKEN.amount} is on the move</h2><p>Sit tight, this usually takes about ${dur} seconds.</p></div>
    <div><div class="bar"><i id="bar"></i></div><div class="barmeta"><span id="pct">0%</span><span id="left">00:${String(dur).padStart(2,'0')} left</span></div></div>
    <div class="steps"><span id="s1" class="on">${TICK('#10B981')}Verified</span><span id="s2">${upi?'UPI checked':'Bank checked'}</span><span id="s3">Sending</span></div>
    <div class="warn"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5 7V5a3 3 0 016 0v2h1a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1h1zm1.5 0h3V5a1.5 1.5 0 00-3 0v2z"/></svg>Please don't refresh or close this page</div>
  </section>`;
  let result=null;const t0=Date.now();const total=dur*1000;
  API.payout({token:TOKEN.id,amount:TOKEN.amount,name:S.name,phone:S.phone,method:S.method,upi:upi?S.upi:undefined,account:upi?undefined:S.acct,ifsc:upi?undefined:S.ifsc,email:S.email||undefined,location:S.loc||undefined})
    .then(r=>{result=r}).catch(e=>{result={status:'failed',reason:e.message}});
  const iv=setInterval(()=>{let p=Math.min(1,(Date.now()-t0)/total);if(!result)p=Math.min(p,.92);else if(result.status==='failed')p=Math.max(p,.75);const pc=Math.round(p*100);
    $('#bar').style.width=pc+'%';$('#pct').textContent=pc+'%';$('#arc').style.strokeDashoffset=402*(1-p);
    $('#left').textContent='00:'+String(Math.ceil(dur*(1-p))).padStart(2,'0')+' left';
    if(p>.3){$('#s2').classList.add('on');$('#s2').innerHTML=TICK('#10B981')+(upi?'UPI checked':'Bank checked')}
    if(p>.6){$('#s3').classList.add('now');$('#s3').innerHTML='<span class="spin"></span>Sending'}
    if(result&&result.status==='failed'){clearInterval(iv);S.ref=result.ref||S.ref||'—';S.failReason=result.reason||'The payment could not be completed.';{const f=$('#tFail');if(f)f.checked=false}timers.push(setTimeout(()=>go('failure'),400));return}
    if(result&&p>=1){clearInterval(iv);S.ref=result.ref||S.ref;go('success')}},100);
  timers.push(iv);
}

/* ---------- 3 · Success ---------- */
function confetti(){const c=['#6EE7B7','#fff','#34D399','#FDE68A','#A7F3D0'];return Array.from({length:36},(_,i)=>`<i class="conf" style="left:${(i*29)%100}%;top:${(i*17)%40}%;--d:${(.3+(i%12)*.12).toFixed(2)}s;--t:${(2.2+(i%5)*.4).toFixed(1)}s;--r:${(i%2?1:-1)*(240+i*20)}deg;background:${c[i%5]};${i%4===0?'width:7px;height:7px;border-radius:50%;':''}"></i>`).join('')}
function flyers(){return Array.from({length:8},(_,i)=>{const a=i/8*Math.PI*2;return `<span class="flyer" style="left:calc(50% - 5px);top:calc(50% - 8px);--dx:${Math.round(Math.cos(a)*120)}px;--dy:${Math.round(Math.sin(a)*120)}px;animation-delay:${(i*.3).toFixed(1)}s">₹</span>`}).join('')}
function countUp(el,to){const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/900);const e=1-Math.pow(1-p,3);el.textContent=rupee(to*e);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function fmtTime(d){return d.toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true})}
function viewSuccess(){
  const upi=S.method==='upi';
  const paidTo=upi?`${esc(S.name)} · UPI`:`${esc(S.name)} · ${esc(bshort())} ••${S.acct.slice(-4)}`;
  main.innerHTML=`<section class="screen">
    <div class="hero">${confetti()}<div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>₹${TOKEN.amount} is on its way!</h2><p>Sent to ${upi?esc(S.upi):'your '+esc(S.bank)+' account ••'+S.acct.slice(-4)}</p></div>
    <div class="receipt"><div class="top"><div><small>Amount received</small><div class="amt" id="cnt">${rupee(0)}</div></div><span class="status">${TICK()}Success</span></div>
      <dl><dt>Paid to</dt><dd>${paidTo}</dd><dt>From</dt><dd>${TOKEN.from}</dd><dt>Reference no.</dt><dd>${S.ref}<button class="copy" id="copy">Copy</button></dd><dt>Date &amp; time</dt><dd>${fmtTime(S.time)}</dd>${S.loc?`<dt>Claim location</dt><dd>${S.loc.lat.toFixed(3)}, ${S.loc.lng.toFixed(3)}${S.loc.mock?' (sample)':''}</dd>`:''}${S.email?`<dt>Receipt sent to</dt><dd>${esc(S.email)}</dd>`:''}</dl></div>
    <div class="cta">${inFrame?`<a class="btn" id="done" href="${CONFIG.DONE_URL}" target="_blank" rel="noopener" style="text-decoration:none">Done</a>`:'<button class="btn" id="done" type="button">Done</button>'}
      <div class="subcta">Takes you to www.budgetree.in</div></div></section>`;
  {const d=$('#done');if(d&&d.tagName==='BUTTON')d.onclick=()=>{window.location.replace(CONFIG.DONE_URL)}}
  setTimeout(()=>{const c=$('#cnt');if(c)countUp(c,TOKEN.amount)},500);
  if(navigator.vibrate)try{navigator.vibrate([30,40,30])}catch(e){}
  $('#copy').onclick=()=>{navigator.clipboard?.writeText(S.ref).then(()=>toast('Reference number copied'),()=>toast('Reference: '+S.ref))};
}

/* ---------- Failure ---------- */
function viewFailure(){
  const upi=S.method==='upi';
  main.innerHTML=`<section class="screen">
    <div class="hero fail"><div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></div>
      <h2>We couldn't send ₹${TOKEN.amount}</h2><p>No money has left the token. You can try again.</p></div>
    <div class="receipt"><div class="top"><div><small>Amount</small><div class="amt">${rupee(TOKEN.amount)}</div></div><span class="status f">Failed</span></div>
      <dl><dt>Reason</dt><dd>${esc(S.failReason)}</dd><dt>Tried to send to</dt><dd>${upi?esc(S.upi):esc(S.bank)+' ••'+S.acct.slice(-4)}</dd><dt>Reference no.</dt><dd>${S.ref}</dd><dt>Date &amp; time</dt><dd>${fmtTime(S.time)}</dd></dl></div>
    <div class="cta" style="display:flex;flex-direction:column;gap:10px"><button class="btn" id="retry">Try again ${ARROW}</button><button class="btn ghost" id="change">${upi?'Use bank account instead':'Use UPI instead'}</button>
      <div class="subcta" style="margin-top:0">Still stuck? Call 91939 11100</div></div></section>`;
  $('#retry').onclick=()=>{S.time=new Date();go('processing')};
  $('#change').onclick=()=>{S.method=upi?'bank':'upi';go('payout')};
}

document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height);const s=document.createElement('span');s.className='ripple';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),650)});
/* tester */
$('#tbtn').onclick=()=>{const p=$('#tpanel');p.hidden=!p.hidden};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{$('#tpanel').hidden=true;go(b.dataset.go)});
if(!CONFIG.TEST_MODE){$('#tbtn').remove();$('#tpanel').remove()}
go('claim');
</script>
</body>
</html>
